# Starts the cauldron when any button on the gamepad is pressed.
# `systemctl start` is a no-op if the service is already running, so this is
# harmless to fire while the show is already up (one of these eight is
# always also whatever the live show itself has that button mapped to --
# see cauldron_controller.py).
#
# These are this specific gamepad's eight real buttons (it has no others --
# see controller.py's docstring), by their raw evdev codes. Found by running
# `evtest /dev/input/eventN` (or the equivalent capture script) and pressing
# each one -- see docs/step-11-auto-start.md. Re-run that discovery step and
# add a line per button if you're using a different pad.
BTN_TRIGGER	1	systemctl start cauldron.service
BTN_THUMB	1	systemctl start cauldron.service
BTN_THUMB2	1	systemctl start cauldron.service
BTN_TOP	1	systemctl start cauldron.service
BTN_TOP2	1	systemctl start cauldron.service
BTN_PINKIE	1	systemctl start cauldron.service
BTN_BASE3	1	systemctl start cauldron.service
BTN_BASE4	1	systemctl start cauldron.service
